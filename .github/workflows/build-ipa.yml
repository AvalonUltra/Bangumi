name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version to build (defaults to expo.version in app.json), for example 8.40.0'
        required: false
        type: string
      force:
        description: 'Rebuild and replace existing release assets.'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - ci-ipa
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Resolve version
        run: |
          set -euo pipefail
          app_version="$(node -p "require('./app.json').expo.version")"
          version="${{ github.event.inputs.version || '' }}"
          if [ -z "$version" ]; then
            version="$app_version"
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "App version: $version (app.json: $app_version)"

          # ios/ 是入库的, 这条流水线不跑 prebuild, 所以 Info.plist 里的
          # CFBundleShortVersionString 是生成那一刻的字面量, 不会随 app.json 变。
          # app.json 一升版本, 装上去的包就会自报旧版本, AltStore 两边一比对,
          # 更新提示永远消不掉。构建前按本次版本同步 (只改 CI 检出的副本)。
          plist="ios/Bangumi/Info.plist"
          plist_version="$(plutil -extract CFBundleShortVersionString raw -o - "$plist")"
          if [ "$plist_version" != "$version" ]; then
            plutil -replace CFBundleShortVersionString -string "$version" "$plist"
            echo "::notice::$plist 里写的是 $plist_version, 已同步为 $version"
          fi

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail

          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile --ignore-engines --ignore-scripts --network-timeout 600000
          else
            yarn install --ignore-engines --ignore-scripts --network-timeout 600000
          fi

          ./node_modules/.bin/patch-package

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail

          node_binary="$(command -v node)"
          {
            printf 'export NODE_BINARY='
            printf '%q' "$node_binary"
            printf '\n'
          } > ios/.xcode.env.local
          echo "NODE_BINARY=$node_binary" >> "$GITHUB_ENV"

          command -v pod || {
            echo "CocoaPods not found on runner image, installing..."
            sudo gem install cocoapods --no-document
          }

          cd ios

          # 入库的 Podfile.lock 是生成那一刻的快照, 而仓库没有 yarn.lock:
          # package.json 里 ~57.0.21 这类范围每次都重新解析, Expo 发个补丁版本,
          # node_modules 里的本地 podspec 就和锁里钉的版本错位, pod install 直接拒绝。
          # 只对这一种失败兜底 —— 丢掉过期的锁按当前依赖重新解析一次;
          # 真正的版本冲突不含这句提示, 仍按原样失败。
          pod_ok=false
          if pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log"; then
            pod_ok=true
          elif grep -qF "changed the version of the dependency" "$RUNNER_TEMP/pod-install.log"; then
            drifted="$(grep -oE 'dependency `[^`]+`' "$RUNNER_TEMP/pod-install.log" | tr -d '`' | awk '{print $2}' | sort -u | tr '\n' ' ')"
            echo "::warning::入库的 ios/Podfile.lock 与当前 node_modules 不一致 (${drifted}), 已按当前依赖重新解析。请更新入库的 Podfile.lock。"
            rm -f Podfile.lock
            if pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log"; then
              pod_ok=true
            fi
          fi

          if [ "$pod_ok" = true ]; then
            echo "pod install OK"
          else
            {
              echo "### pod install log (last 150 lines)"
              echo '```'
              tail -n 150 "$RUNNER_TEMP/pod-install.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::pod install failed, log tail follows as base64 chunks"
            tail -n 150 "$RUNNER_TEMP/pod-install.log" | base64 | fold -w 3000 | head -n 8 | while IFS= read -r chunk; do
              echo "::error::LOGCHUNK:$chunk"
            done
            exit 1
          fi

          # fmt 用 __apple_build_version__ < 14000029L 判断要不要绕开一个 clang 问题,
          # 新版工具链会踩到。三种结果都打印出来: 之前这里 gsub 匹配不到会无声跳过,
          # 等到编译报错才发现补丁早就失效了。
          fmt_base_h="Pods/fmt/include/fmt/base.h"
          fmt_guard='defined(__apple_build_version__) && __apple_build_version__ < 14000029L'

          if [ ! -f "$fmt_base_h" ]; then
            echo "::notice::这套依赖里没有 Pods/fmt, 跳过 fmt 兼容补丁"
          elif grep -qF "$fmt_guard" "$fmt_base_h"; then
            ruby -0777 -pi -e 'gsub("defined(__apple_build_version__) && __apple_build_version__ < 14000029L", "defined(__apple_build_version__)")' "$fmt_base_h"
            echo "Patched fmt for Xcode clang compatibility"
          else
            echo "::notice::fmt 已不带 __apple_build_version__ 判断, 跳过兼容补丁"
          fi

      - name: Upload pod install log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pod-install-log
          path: /Users/runner/work/_temp/pod-install.log
          if-no-files-found: ignore

      - name: Build Release app
        env:
          NODE_ENV: production
          ENTRY_FILE: index.js
        run: |
          set -euo pipefail
          cd ios

          if xcodebuild \
            -workspace Bangumi.xcworkspace \
            -scheme Bangumi \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            CLANG_WARN_DOCUMENTATION_COMMENTS=NO \
            SWIFT_SUPPRESS_WARNINGS=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"; then
            echo "xcodebuild OK"
          else
            {
              echo "### xcodebuild errors"
              echo '```'
              grep -E ' error: ' "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -n 40 || true
              echo '```'
              echo "### last 60 lines"
              echo '```'
              tail -n 60 "$RUNNER_TEMP/xcodebuild.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            err_b64="$(grep -E ' error: ' "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -n 20 | base64 | tr -d '\n')"
            echo "::error::XCODEERR:${err_b64:0:3900}"
            tail_b64="$(tail -n 30 "$RUNNER_TEMP/xcodebuild.log" | base64 | tr -d '\n')"
            echo "::error::XCODETAIL:${tail_b64:0:3900}"
            exit 1
          fi

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /Users/runner/work/_temp/xcodebuild.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          set -euo pipefail

          app_path="ios/build/Build/Products/Release-iphoneos/Bangumi.app"
          if [ ! -d "$app_path" ]; then
            echo "::error::Expected .app not found: $app_path"
            exit 1
          fi

          payload_root="$RUNNER_TEMP/ipa-payload"
          rm -rf "$payload_root"
          mkdir -p "$payload_root/Payload"
          cp -R "$app_path" "$payload_root/Payload/"

          asset_name="bangumi_v${{ env.VERSION }}.ipa"
          target_ipa="$GITHUB_WORKSPACE/$asset_name"
          (cd "$payload_root" && zip -qr "$target_ipa" Payload)

          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "$asset_name" > "$asset_name.sha256"

          echo "ASSET_NAME=$asset_name" >> "$GITHUB_ENV"
          echo "IPA_PATH=$target_ipa" >> "$GITHUB_ENV"
          echo "SHA_PATH=$target_ipa.sha256" >> "$GITHUB_ENV"

      - name: Validate IPA
        run: |
          set -euo pipefail

          unzip -t "$IPA_PATH"

          info_plist="$RUNNER_TEMP/Bangumi-Info.plist"
          unzip -p "$IPA_PATH" "Payload/Bangumi.app/Info.plist" > "$info_plist"

          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - "$info_plist")"
          if [ "$bundle_version" != "${{ env.VERSION }}" ]; then
            echo "::error::Bundle version $bundle_version does not match expected version ${{ env.VERSION }}."
            exit 1
          fi

          # app.json 不声明 userInterfaceStyle 时 Expo 默认按 "light" 生成,
          # prebuild 会写进 UIUserInterfaceStyle=Light, 在 UIKit 层把应用钉死在亮色,
          # Appearance.getColorScheme() 永远返回 light, 应用内的"跟随系统"静默失效。
          interface_style="$(plutil -extract UIUserInterfaceStyle raw -o - "$info_plist" 2>/dev/null || echo '')"
          case "$interface_style" in
            Automatic|Dark) echo "UIUserInterfaceStyle: $interface_style" ;;
            Light) echo "::error::UIUserInterfaceStyle 为 Light, 主题跟随系统无法工作"; exit 1 ;;
            '') echo "::error::Info.plist 缺少 UIUserInterfaceStyle"; exit 1 ;;
            *) echo "::error::UIUserInterfaceStyle 取值异常: $interface_style"; exit 1 ;;
          esac

          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$info_plist" 2>/dev/null || echo '')"
          case "$bundle_id" in
            ''|*'$('*) echo "::error::CFBundleIdentifier 未在构建时替换: '$bundle_id'"; exit 1 ;;
          esac

          # 只查版本号的话, 一个 JS bundle 阶段被跳过的空壳包也能完整通过校验
          work_dir="$(mktemp -d)"
          unzip -p "$IPA_PATH" "Payload/Bangumi.app/main.jsbundle" > "$work_dir/main.jsbundle" 2>/dev/null || {
            echo "::error::IPA 里没有 main.jsbundle"; exit 1; }
          bundle_bytes="$(stat -f%z "$work_dir/main.jsbundle")"
          [ "$bundle_bytes" -ge 1048576 ] || {
            echo "::error::main.jsbundle 只有 $bundle_bytes 字节, Metro/Hermes 阶段没有产出真正的 bundle"; exit 1; }
          hermes_magic="$(od -An -tx1 -N4 "$work_dir/main.jsbundle" | tr -d ' \n')"
          [ "$hermes_magic" = "c61fbc03" ] ||
            echo "::warning::main.jsbundle 不是 Hermes 字节码 (magic $hermes_magic)"

          unzip -p "$IPA_PATH" "Payload/Bangumi.app/Bangumi" > "$work_dir/Bangumi" 2>/dev/null
          archs="$(lipo -archs "$work_dir/Bangumi" 2>/dev/null || echo '')"
          case "$archs" in
            *arm64*) echo "架构: $archs" ;;
            *) echo "::error::可执行文件不含 arm64 (lipo: '${archs:-读不出}')"; exit 1 ;;
          esac
          rm -rf "$work_dir"

          echo "IPA 校验通过: $bundle_version, $interface_style, jsbundle ${bundle_bytes} 字节"

          app_path="ios/build/Build/Products/Release-iphoneos/Bangumi.app"
          set +e
          codesign_output="$(codesign -dv "$app_path" 2>&1)"
          codesign_status="$?"
          set -e

          echo "$codesign_output"

          if [ "$codesign_status" -eq 0 ]; then
            echo "::error::Expected unsigned app, but codesign reported a valid signature."
            exit 1
          fi

          if [[ "$codesign_output" != *"code object is not signed at all"* ]]; then
            echo "::error::codesign did not report the expected unsigned-app message."
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ env.VERSION }}
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.SHA_PATH }}
          retention-days: 14

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ github.event.inputs.force == 'true' }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Unsigned IPA build of $TAG. Sideload with AltStore / Sideloadly / TrollStore."
          fi

          gh release upload "$TAG" "$IPA_PATH" "$SHA_PATH" --clobber

      - name: Update alt_store.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # tag 构建时 checkout 的是浅克隆标签, 没有 origin/master 引用, 用 FETCH_HEAD 对齐
          # 下面会 reset 到 origin/master, 先把生成脚本挪出工作区
          generator="$RUNNER_TEMP/generate-altstore.py"
          cp .github/scripts/generate-altstore.py "$generator"

          # 期间可能有别的推送落到 master, 基于最新的 master 重新生成再试
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin master
            git reset --hard FETCH_HEAD

            python3 "$generator" \
              --version "$VERSION" \
              --output alt_store.json

            git add alt_store.json

            if git diff --cached --quiet; then
              echo "alt_store.json already up to date."
              exit 0
            fi

            git commit -m "chore: update AltStore source $TAG"

            if git push origin HEAD:master; then
              echo "Published alt_store.json for $TAG."
              exit 0
            fi

            echo "::notice::第 $attempt 次推送被拒, 重新基于 master 生成后重试"
            sleep $((attempt * 5))
          done

          echo "::error::alt_store.json 推送 5 次均失败"
          exit 1
